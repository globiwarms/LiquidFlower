<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>LiquidFlower</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <!-- Liquid Glass refraction: displaces the captured backdrop like wet glass -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="lg-refraction" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.013" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div id="menu" class=""></div>
  <script src="./shared/icons.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
